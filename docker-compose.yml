name: guacamole

services:
  guacd:
    image: guacamole/guacd:${GUAC_VERSION:-1.6.0}
    container_name: guacd
    restart: unless-stopped
    volumes:
      - ./data/drive:/drive:rw        # 파일 전송용 가상 드라이브
      - ./data/record:/record:rw      # 세션 녹화 저장소
    networks: [guac-net]

  postgres:
    image: postgres:16-alpine
    container_name: guac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/guacamole
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro   # 최초 기동 시 스키마 생성
      - postgres-data:/var/lib/postgresql/data   # Docker 볼륨 (권한 문제 방지)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [guac-net]

  guacamole:
    image: guacamole/guacamole:${GUAC_VERSION:-1.6.0}
    container_name: guacamole
    restart: unless-stopped
    depends_on:
      guacd:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: ${POSTGRES_DB}
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_AUTO_CREATE_ACCOUNTS: "false"
      TOTP_ENABLED: ${TOTP_ENABLED:-true}
      BAN_MAX_INVALID_ATTEMPTS: ${BAN_MAX_INVALID_ATTEMPTS:-5}
      BAN_ADDRESS_DURATION: ${BAN_ADDRESS_DURATION:-300}
      RECORDING_SEARCH_PATH: /record
      REMOTE_IP_VALVE_ENABLED: "true"   # nginx 뒤에서 실제 클라이언트 IP 인식
      WEBAPP_CONTEXT: ROOT              # https://host/ 로 바로 접속
    volumes:
      - ./data/record:/record:ro
    networks: [guac-net]
    # 외부 포트를 직접 노출하지 않음 (nginx 경유)

  nginx:
    image: nginx:1.27-alpine
    container_name: guac-nginx
    restart: unless-stopped
    depends_on: [guacamole]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/guacamole.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks: [guac-net]

volumes:
  postgres-data:

networks:
  guac-net:
    driver: bridge
